name: Framework regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workflow parser
        run: python -m pip install -r requirements-workflow.txt
      - name: Test without native credentials or Coding tasks
        run: python -m unittest test_workflow test_workflow_library test_pipeline test_reload_gateway -q
      - name: Check browser scripts
        run: |
          node --check ui/workflow.js
          node --check ui/workflow-view.js
          node --check ui/crew-entry.js
          node --check ui/live.js
      - name: Verify public distribution
        run: python build_pipeline_kit.py
