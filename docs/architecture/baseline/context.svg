<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 876"
      role="img" aria-labelledby="context-title context-desc">
      <title id="context-title">Session 与 Context 的交接及保存</title><desc id="context-desc">Workflow 包含 Sessions，Session 包含 Tasks；运行版本与后端身份都可追溯。</desc>
      <style>
      text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
      .title{font-size:30px;font-weight:700;fill:#153a68}
      .subtitle{font-size:18px;fill:#586e88}
      .label{font-size:21px;font-weight:650;fill:#193f71}
      .sub{font-size:17px;fill:#435c78}
      .native rect{fill:#f2f7ff;stroke:#a6c4ea;stroke-width:1.5}
      .extension rect{fill:#fff8eb;stroke:#d7b46f;stroke-width:1.5}
      .data rect{fill:#f0f8f5;stroke:#9ac8b5;stroke-width:1.5}
      .muted rect{fill:#f7f9fc;stroke:#c6d0dd;stroke-width:1.5}
      .edge{fill:none;stroke:#5a7fa8;stroke-width:2}
      .edge-label{font-size:17px;fill:#385d86;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
      .lane{stroke:#c8d5e5;stroke-dasharray:6 8;stroke-width:1.5}
      .note{font-size:17px;fill:#586e88}
      </style>
      <defs><marker id="context-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9" fill="#5a7fa8"/></marker></defs>
      <rect width="1440" height="876" fill="#fff"/>
      <text x="36" y="48" class="title" text-anchor="start">Session 与 Context 的交接及保存</text><text x="36" y="82" class="subtitle" text-anchor="start">Workflow 包含 Sessions，Session 包含 Tasks；运行版本与后端身份都可追溯。</text><path d="M215 235 V285" class="edge" marker-end="url(#context-arrow)"/><text x="70" y="268" class="edge-label" text-anchor="start">准备时冻结版本</text><path d="M215 390 V445" class="edge" marker-end="url(#context-arrow)"/><text x="70" y="424" class="edge-label" text-anchor="start">按步骤分派</text><path d="M395 496 H450" class="edge" marker-end="url(#context-arrow)"/><path d="M850 368 H880 V184 M880 368 V532" class="edge"/><path d="M880 184 H910" class="edge" stroke-dasharray="7 6" marker-end="url(#context-arrow)"/><path d="M880 300 H910" class="edge" stroke-dasharray="7 6" marker-end="url(#context-arrow)"/><path d="M880 416 H910" class="edge" stroke-dasharray="7 6" marker-end="url(#context-arrow)"/><path d="M880 532 H910" class="edge" stroke-dasharray="7 6" marker-end="url(#context-arrow)"/><g class="extension"><rect x="35" y="140" width="360" height="95" rx="12"/><text x="57" y="172" class="label" text-anchor="start">Workflow · r1 / r2 / r3</text><text x="57" y="200" class="sub" text-anchor="start">编辑生成新版本；旧版本保留</text></g><g class="native"><rect x="35" y="285" width="360" height="105" rx="12"/><text x="57" y="317" class="label" text-anchor="start">本次主 Session / run</text><text x="57" y="345" class="sub" text-anchor="start">固定 revision + SHA-256</text><text x="57" y="369" class="sub" text-anchor="start">App 继续使用本次快照</text></g><g class="native"><rect x="35" y="445" width="360" height="105" rx="12"/><text x="57" y="477" class="label" text-anchor="start">逻辑 Task → 执行尝试</text><text x="57" y="505" class="sub" text-anchor="start">run-id / step-id</text><text x="57" y="529" class="sub" text-anchor="start">真实执行 ID 与子 Session 另记</text></g><g class="data"><rect x="450" y="245" width="400" height="265" rx="12"/><text x="472" y="277" class="label" text-anchor="start">同一次运行的交接目录</text><text x="472" y="305" class="sub" text-anchor="start">REQUEST.md：原始需求</text><text x="472" y="329" class="sub" text-anchor="start">step-instructions：完整任务</text><text x="472" y="353" class="sub" text-anchor="start">前序完整返回 / handoff</text><text x="472" y="377" class="sub" text-anchor="start">代码 / candidate.diff / tests</text><text x="472" y="401" class="sub" text-anchor="start">accepted：身份与交接证据</text><text x="472" y="425" class="sub" text-anchor="start">按需读取，存在重读成本</text></g><g class="native"><rect x="910" y="140" width="495" height="88" rx="12"/><text x="932" y="172" class="label" text-anchor="start">Kiro CLI · 独立原生 Session</text><text x="932" y="200" class="sub" text-anchor="start">自身上下文 / 选中 Agent 配置</text></g><g class="native"><rect x="910" y="256" width="495" height="88" rx="12"/><text x="932" y="288" class="label" text-anchor="start">Claude Code · 独立原生 Session</text><text x="932" y="316" class="sub" text-anchor="start">自身上下文 / Claude Skills 与工具</text></g><g class="native"><rect x="910" y="372" width="495" height="88" rx="12"/><text x="932" y="404" class="label" text-anchor="start">Codex · 独立原生 Session</text><text x="932" y="432" class="sub" text-anchor="start">自身上下文 / Codex Skills 与工具</text></g><g class="native"><rect x="910" y="488" width="495" height="88" rx="12"/><text x="932" y="520" class="label" text-anchor="start">OpenCode · 独立原生 Session</text><text x="932" y="548" class="sub" text-anchor="start">自身上下文 / OpenCode 配置</text></g><text x="35" y="620" class="label" text-anchor="start">共享的是明确材料，不是一个跨模型的隐式上下文窗口。keep=true；include_memory=false。</text><g class="data"><rect x="35" y="672" width="430" height="115" rx="12"/><text x="57" y="704" class="label" text-anchor="start">工作流文件持久化</text><text x="57" y="732" class="sub" text-anchor="start">定义版本、运行 manifest、证据</text><text x="57" y="756" class="sub" text-anchor="start">文件锁 + 原子替换；未新增 SQLite</text></g><g class="data"><rect x="505" y="672" width="430" height="115" rx="12"/><text x="527" y="704" class="label" text-anchor="start">KiroCrew 原生持久化</text><text x="527" y="732" class="sub" text-anchor="start">主 / 子对话、父子关系与执行记录</text><text x="527" y="756" class="sub" text-anchor="start">工作台归档不等于删除原生会话</text></g><g class="muted"><rect x="975" y="672" width="430" height="115" rx="12"/><text x="997" y="704" class="label" text-anchor="start">工具自身状态</text><text x="997" y="732" class="sub" text-anchor="start">工具原生历史、认证与私有配置</text><text x="997" y="756" class="sub" text-anchor="start">Session ZIP 不包含全部私有状态</text></g><text x="35" y="842" class="note" text-anchor="start">spawn_continue 可保留工具会话并生成新的执行 Task ID；保存完整身份链才能解释续作。</text></svg>