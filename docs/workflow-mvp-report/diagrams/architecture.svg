<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" role="img" aria-label="MVP 分层架构" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><title>MVP 分层架构</title><desc>蓝色为配置和观察，绿色为原生执行；ProviderRegistry 是扩展组合点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748aad"/></marker></defs><rect width="1100" height="710" fill="white"/><text x="35" y="33" text-anchor="start" font-size="17" font-weight="650" fill="#185adb">配置与观察：Octopus 提供</text><g data-node="entry"><rect x="35" y="55" width="310" height="95" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M36 75v55" stroke="#185adb" stroke-width="3"/><text x="190.0" y="84" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">三种入口</text><text x="190.0" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">Web · 文件 · Chat</text></g><g data-node="config"><rect x="395" y="55" width="310" height="95" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M396 75v55" stroke="#185adb" stroke-width="3"/><text x="550.0" y="84" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">定义 / 版本 / 快照</text><text x="550.0" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">workflow.py / library / files</text></g><g data-node="observer"><rect x="755" y="55" width="310" height="95" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M756 75v55" stroke="#185adb" stroke-width="3"/><text x="910.0" y="84" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">任务状态与证据</text><text x="910.0" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">观察器 · accept · Web 预览</text></g><path d="M345 103L395 103" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 150V172H190V218" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="177" text-anchor="start" font-size="13" font-weight="500" fill="#516581">固定版本与原始需求</text><text x="35" y="199" text-anchor="start" font-size="17" font-weight="650" fill="#117d58">执行与生命周期：KiroCrew 原生能力</text><g data-node="parent"><rect x="35" y="218" width="310" height="95" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M36 238v55" stroke="#117d58" stroke-width="3"/><text x="190.0" y="247" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">原生父 Session</text><text x="190.0" y="273" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">需求 · next · 完成后 accept</text></g><g data-node="gateway"><rect x="395" y="218" width="310" height="95" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M396 238v55" stroke="#117d58" stroke-width="3"/><text x="550.0" y="247" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">Gateway / SubagentManager</text><text x="550.0" y="273" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">原生 MCP spawn_run · 权限 · 完成</text></g><g data-node="registry"><rect x="755" y="218" width="310" height="95" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M756 238v55" stroke="#117d58" stroke-width="3"/><text x="910.0" y="247" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">ProviderRegistry</text><text x="910.0" y="273" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">Octopus 在已有 factory 接口选路</text></g><path d="M345 267L395 267" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><text x="370.0" y="258.0" text-anchor="middle" font-size="13" font-weight="500" fill="#516581">MCP</text><path d="M705 267L755 267" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 218L910 150" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="910.0" y="175.0" text-anchor="middle" font-size="13" font-weight="500" fill="#516581">路由证据</text><path d="M705 250L730 250L730 104L755 104" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="740" y="204" text-anchor="start" font-size="12" font-weight="500" fill="#516581">原生任务 / 权限</text><path d="M910 313L910 350" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g data-node="acp"><rect x="35" y="350" width="1030" height="73" rx="12" fill="#e7f8fa" stroke="#007a88" stroke-opacity=".36"/><path d="M36 370v33" stroke="#007a88" stroke-width="3"/><text x="550.0" y="379" text-anchor="middle" font-size="18" font-weight="650" fill="#007a88">原生 AcpProvider / AcpRuntime / AcpClient</text><text x="550.0" y="405" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">能力协商 → 创建或恢复工具 Session → 配置 → Prompt → Update / Permission / Completion</text></g><path d="M154 423L154 471" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g data-node="kiro cli"><rect x="35" y="471" width="238" height="93" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M36 491v53" stroke="#7052b7" stroke-width="3"/><text x="154.0" y="500" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">Kiro CLI</text><text x="154.0" y="526" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">kiro-cli acp</text></g><path d="M418 423L418 471" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g data-node="claude code"><rect x="299" y="471" width="238" height="93" rx="12" fill="#fff4df" stroke="#9d6100" stroke-opacity=".36"/><path d="M300 491v53" stroke="#9d6100" stroke-width="3"/><text x="418.0" y="500" text-anchor="middle" font-size="18" font-weight="650" fill="#9d6100">Claude Code</text><text x="418.0" y="526" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">claude-agent-acp</text></g><path d="M682 423L682 471" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g data-node="codex"><rect x="563" y="471" width="238" height="93" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M564 491v53" stroke="#185adb" stroke-width="3"/><text x="682.0" y="500" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">Codex</text><text x="682.0" y="526" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">codex-acp → App Server</text></g><path d="M946 423L946 471" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g data-node="opencode"><rect x="827" y="471" width="238" height="93" rx="12" fill="#e7f8fa" stroke="#007a88" stroke-opacity=".36"/><path d="M828 491v53" stroke="#007a88" stroke-width="3"/><text x="946.0" y="500" text-anchor="middle" font-size="18" font-weight="650" fill="#007a88">OpenCode</text><text x="946.0" y="526" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">原生 OpenCode ACP</text></g><g data-node="context"><rect x="35" y="603" width="1030" height="78" rx="12" fill="#f2f5fa" stroke="#516581" stroke-opacity=".36"/><path d="M36 623v38" stroke="#516581" stroke-width="3"/><text x="550.0" y="632" text-anchor="middle" font-size="18" font-weight="650" fill="#516581">每个工具使用自己的模型服务认证、工具配置和原生 Session</text><text x="550.0" y="658" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">同一 Run 工作区交接文件；不把四个工具拼成同一个模型上下文窗口</text></g><path d="M154 564L154 603" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M418 564L418 603" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M682 564L682 603" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M946 564L946 603" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/></svg>