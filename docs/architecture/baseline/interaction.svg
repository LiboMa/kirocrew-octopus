<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1330"
      role="img" aria-labelledby="interaction-title interaction-desc">
      <title id="interaction-title">从一个需求到多个 Coding Agent 的交互流程</title><desc id="interaction-desc">默认示例：Kiro 分析 → Claude 编码 → Codex 审查 → OpenCode Web 交付。</desc>
      <style>
      text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
      .title{font-size:30px;font-weight:700;fill:#153a68}
      .subtitle{font-size:18px;fill:#586e88}
      .label{font-size:21px;font-weight:650;fill:#193f71}
      .sub{font-size:17px;fill:#435c78}
      .native rect{fill:#f2f7ff;stroke:#a6c4ea;stroke-width:1.5}
      .extension rect{fill:#fff8eb;stroke:#d7b46f;stroke-width:1.5}
      .data rect{fill:#f0f8f5;stroke:#9ac8b5;stroke-width:1.5}
      .muted rect{fill:#f7f9fc;stroke:#c6d0dd;stroke-width:1.5}
      .edge{fill:none;stroke:#5a7fa8;stroke-width:2}
      .edge-label{font-size:17px;fill:#385d86;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
      .lane{stroke:#c8d5e5;stroke-dasharray:6 8;stroke-width:1.5}
      .note{font-size:17px;fill:#586e88}
      </style>
      <defs><marker id="interaction-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9" fill="#5a7fa8"/></marker></defs>
      <rect width="1440" height="1330" fill="#fff"/>
      <text x="36" y="48" class="title" text-anchor="start">从一个需求到多个 Coding Agent 的交互流程</text><text x="36" y="82" class="subtitle" text-anchor="start">默认示例：Kiro 分析 → Claude 编码 → Codex 审查 → OpenCode Web 交付。</text><path d="M140 185 V1270" class="lane"/><g class="native"><rect x="12" y="120" width="256" height="65" rx="12"/><text x="34" y="152" class="label" text-anchor="start">用户 / 工作台</text></g><path d="M430 185 V1270" class="lane"/><g class="native"><rect x="302" y="120" width="256" height="65" rx="12"/><text x="324" y="152" class="label" text-anchor="start">KiroCrew 主 Agent</text></g><path d="M715 185 V1270" class="lane"/><g class="native"><rect x="587" y="120" width="256" height="65" rx="12"/><text x="609" y="152" class="label" text-anchor="start">Gateway / 子任务</text></g><path d="M1000 185 V1270" class="lane"/><g class="native"><rect x="872" y="120" width="256" height="65" rx="12"/><text x="894" y="152" class="label" text-anchor="start">ACP Harness</text></g><path d="M1290 185 V1270" class="lane"/><g class="native"><rect x="1162" y="120" width="256" height="65" rx="12"/><text x="1184" y="152" class="label" text-anchor="start">运行目录 / 核对</text></g><path d="M140 230 H1290" class="edge" marker-end="url(#interaction-arrow)"/><text x="715.0" y="217" class="edge-label" text-anchor="middle">1  固定 Workflow 版本、需求和运行目录</text><path d="M140 300 H430" class="edge" marker-end="url(#interaction-arrow)"/><text x="285.0" y="287" class="edge-label" text-anchor="middle">2  向 App 发送需求</text><path d="M430 370 H1290" class="edge" marker-end="url(#interaction-arrow)"/><text x="860.0" y="357" class="edge-label" text-anchor="middle">3  next_step：取得原生 spawn 参数</text><path d="M430 440 H715" class="edge" marker-end="url(#interaction-arrow)"/><text x="572.5" y="427" class="edge-label" text-anchor="middle">4  MCP spawn_run</text><path d="M715 510 H1000" class="edge" marker-end="url(#interaction-arrow)"/><text x="857.5" y="497" class="edge-label" text-anchor="middle">5  路由并创建子会话</text><path d="M1000 580 H1290" class="edge" marker-end="url(#interaction-arrow)"/><text x="1145.0" y="567" class="edge-label" text-anchor="middle">6  读取需求与前序交接</text><path d="M1000 650 H1290" class="edge" marker-end="url(#interaction-arrow)"/><text x="1145.0" y="637" class="edge-label" text-anchor="middle">7  写代码 / diff / 测试</text><path d="M1000 720 H715" class="edge" stroke-dasharray="7 6" marker-end="url(#interaction-arrow)"/><text x="857.5" y="707" class="edge-label" text-anchor="middle">需要时请求权限</text><path d="M1000 790 H715" class="edge" stroke-dasharray="7 6" marker-end="url(#interaction-arrow)"/><text x="857.5" y="777" class="edge-label" text-anchor="middle">8  原生结果 / 完成</text><path d="M715 860 H430" class="edge" stroke-dasharray="7 6" marker-end="url(#interaction-arrow)"/><text x="572.5" y="847" class="edge-label" text-anchor="middle">9  完成事件唤醒</text><path d="M140 930 H715" class="edge" stroke-dasharray="7 6" marker-end="url(#interaction-arrow)"/><text x="427.5" y="917" class="edge-label" text-anchor="middle">工作台只读观察任务、权限和路由证据</text><path d="M430 1000 H1290" class="edge" marker-end="url(#interaction-arrow)"/><text x="860.0" y="987" class="edge-label" text-anchor="middle">10  accept(真实 Task ID)：核对归属、参数与 handoff</text><path d="M1290 1070 H430" class="edge" stroke-dasharray="7 6" marker-end="url(#interaction-arrow)"/><text x="860.0" y="1057" class="edge-label" text-anchor="middle">通过才取下一步；失败保留问题与证据</text><path d="M1290 1200 H140" class="edge" stroke-dasharray="7 6" marker-end="url(#interaction-arrow)"/><text x="715.0" y="1187" class="edge-label" text-anchor="middle">11  最终 Web 产物、状态报告与可导出的开发文档</text><g class="extension"><rect x="280" y="1100" width="890" height="63" rx="12"/><text x="302" y="1132" class="label" text-anchor="start">对后续任务重复步骤 3–10；不是网页后台直接执行 Coding CLI</text></g><text x="36" y="1297" class="note" text-anchor="start">Harness 内部完成自己的推理与工具循环。权限事件是否出现取决于原生权限规则与本次能力。</text></svg>