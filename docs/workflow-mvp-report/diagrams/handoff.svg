<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 482" role="img" aria-label="交接核对的证据链" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><title>交接核对的证据链</title><desc>当前仅哈希 handoff 文件，未自动绑定全部候选代码与审查结论；已交接不是自动质量认证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748aad"/></marker></defs><rect width="1100" height="482" fill="white"/><g><rect x="30.0" y="32" width="330.6666666666667" height="98" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M31.0 52v58" stroke="#185adb" stroke-width="3"/><text x="195.33333333333334" y="61" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">观察快照有效</text><text x="195.33333333333334" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">connected 且 age &lt; 20 秒</text></g><g><rect x="384.6666666666667" y="32" width="330.6666666666667" height="98" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M385.6666666666667 52v58" stroke="#185adb" stroke-width="3"/><text x="550.0" y="61" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">身份正确</text><text x="550.0" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">当前步骤 / 父会话 / Task / Agent</text></g><path d="M360.6666666666667 81L384.6666666666667 81" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="739.3333333333334" y="32" width="330.6666666666667" height="98" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M740.3333333333334 52v58" stroke="#117d58" stroke-width="3"/><text x="904.6666666666667" y="61" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">原生执行结束</text><text x="904.6666666666667" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">非 error / stopped / 空响应</text></g><path d="M715.3333333333334 81L739.3333333333334 81" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="30.0" y="182" width="330.6666666666667" height="98" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M31.0 202v58" stroke="#7052b7" stroke-width="3"/><text x="195.33333333333334" y="211" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">后端与模型</text><text x="195.33333333333334" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">route + 请求模型 + 实际模型</text></g><g><rect x="384.6666666666667" y="182" width="330.6666666666667" height="98" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M385.6666666666667 202v58" stroke="#7052b7" stroke-width="3"/><text x="550.0" y="211" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">Effort 与续作</text><text x="550.0" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">请求对应 Task；实际值按报告核对</text></g><path d="M360.6666666666667 231L384.6666666666667 231" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="739.3333333333334" y="182" width="330.6666666666667" height="98" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M740.3333333333334 202v58" stroke="#117d58" stroke-width="3"/><text x="904.6666666666667" y="211" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">真实交接存在</text><text x="904.6666666666667" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">非 BLOCKED · 非空 handoff</text></g><path d="M715.3333333333334 231L739.3333333333334 231" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M904.6666666666667 130V159H195.33333333333334V182" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="30.0" y="332" width="330.6666666666667" height="98" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M31.0 352v58" stroke="#117d58" stroke-width="3"/><text x="195.33333333333334" y="361" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">保存 accepted 收据</text><text x="195.33333333333334" y="387" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">结果与 handoff SHA-256</text></g><g><rect x="384.6666666666667" y="332" width="330.6666666666667" height="98" rx="12" fill="#e7f8fa" stroke="#007a88" stroke-opacity=".36"/><path d="M385.6666666666667 352v58" stroke="#007a88" stroke-width="3"/><text x="550.0" y="361" text-anchor="middle" font-size="18" font-weight="650" fill="#007a88">已交接进度增加</text><text x="550.0" y="387" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">接受数 / 总任务数</text></g><path d="M360.6666666666667 381L384.6666666666667 381" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="739.3333333333334" y="332" width="330.6666666666667" height="98" rx="12" fill="#fff4df" stroke="#9d6100" stroke-opacity=".36"/><path d="M740.3333333333334 352v58" stroke="#9d6100" stroke-width="3"/><text x="904.6666666666667" y="361" text-anchor="middle" font-size="18" font-weight="650" fill="#9d6100">独立质量责任</text><text x="904.6666666666667" y="387" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">仍要核对真实 diff / 测试 / review</text></g><path d="M715.3333333333334 381L739.3333333333334 381" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M904.6666666666667 280V309H195.33333333333334V332" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="470" text-anchor="start" font-size="15" font-weight="500" fill="#516581">当前仅哈希 handoff 文件，未自动绑定全部候选代码与审查结论；已交接不是自动质量认证。</text></svg>