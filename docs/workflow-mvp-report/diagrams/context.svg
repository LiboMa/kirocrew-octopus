<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 482" role="img" aria-label="Context 如何跨工具传递" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><title>Context 如何跨工具传递</title><desc>文件传递仍有读取成本与缺失风险；include_memory=false，不把长期 Memory 当成本次任务依赖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748aad"/></marker></defs><rect width="1100" height="482" fill="white"/><g><rect x="30.0" y="32" width="330.6666666666667" height="98" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M31.0 52v58" stroke="#185adb" stroke-width="3"/><text x="195.33333333333334" y="61" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">用户原始需求</text><text x="195.33333333333334" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">input.json / REQUEST.md</text></g><g><rect x="384.6666666666667" y="32" width="330.6666666666667" height="98" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M385.6666666666667 52v58" stroke="#7052b7" stroke-width="3"/><text x="550.0" y="61" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">固定 Workflow</text><text x="550.0" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">步骤 · 工具 · 参数 · hash</text></g><path d="M360.6666666666667 81L384.6666666666667 81" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="739.3333333333334" y="32" width="330.6666666666667" height="98" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M740.3333333333334 52v58" stroke="#185adb" stroke-width="3"/><text x="904.6666666666667" y="61" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">本步完整指令</text><text x="904.6666666666667" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">step-instructions.md</text></g><path d="M715.3333333333334 81L739.3333333333334 81" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="30.0" y="182" width="330.6666666666667" height="98" rx="12" fill="#fff4df" stroke="#9d6100" stroke-opacity=".36"/><path d="M31.0 202v58" stroke="#9d6100" stroke-width="3"/><text x="195.33333333333334" y="211" text-anchor="middle" font-size="18" font-weight="650" fill="#9d6100">短分派文本 ≤ 5,000 字符</text><text x="195.33333333333334" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">摘要 + 完整文件路径</text></g><g><rect x="384.6666666666667" y="182" width="330.6666666666667" height="98" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M385.6666666666667 202v58" stroke="#117d58" stroke-width="3"/><text x="550.0" y="211" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">目标工具读取文件</text><text x="550.0" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">共享本次 cwd，不共享私有历史</text></g><path d="M360.6666666666667 231L384.6666666666667 231" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="739.3333333333334" y="182" width="330.6666666666667" height="98" rx="12" fill="#e7f8fa" stroke="#007a88" stroke-opacity=".36"/><path d="M740.3333333333334 202v58" stroke="#007a88" stroke-width="3"/><text x="904.6666666666667" y="211" text-anchor="middle" font-size="18" font-weight="650" fill="#007a88">实际执行</text><text x="904.6666666666667" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">代码 · diff · tests · handoff</text></g><path d="M715.3333333333334 231L739.3333333333334 231" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M904.6666666666667 130V159H195.33333333333334V182" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="30.0" y="332" width="330.6666666666667" height="98" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M31