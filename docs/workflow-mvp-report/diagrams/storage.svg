<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 683" role="img" aria-label="保存、冻结与运行证据" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><title>保存、冻结与运行证据</title><desc>实线表示保存与产物流程，虚线表示管理关联或原生数据来源；归档不替换 Run 或原生 Session。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748aad"/></marker></defs><rect width="1100" height="683" fill="white"/><g><rect x="35" y="30" width="310" height="88" rx="12" fill="#f2f5fa" stroke="#516581" stroke-opacity=".36"/><path d="M36 50v48" stroke="#516581" stroke-width="3"/><text x="190.0" y="59" text-anchor="middle" font-size="18" font-weight="650" fill="#516581">浏览器草稿</text><text x="190.0" y="85" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">localStorage：向导 / 布局</text></g><g><rect x="395" y="30" width="310" height="88" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M396 50v48" stroke="#185adb" stroke-width="3"/><text x="550.0" y="59" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">显式 save</text><text x="550.0" y="85" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">校验 · 唯一名称 · 文件锁</text></g><g><rect x="755" y="30" width="310" height="88" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M756 50v48" stroke="#7052b7" stroke-width="3"/><text x="910.0" y="59" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">定义 / 版本库</text><text x="910.0" y="85" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">最新定义 + 不可变版本 JSON</text></g><path d="M345 74L395 74" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 74L755 74" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="395" y="206" width="310" height="94" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M396 226v54" stroke="#7052b7" stroke-width="3"/><text x="550.0" y="235" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">Run 固定快照</text><text x="550.0" y="261" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">workflow-run.json + 配置 hash</text></g><path d="M910 118L550 206" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><text x="730.0" y="153.0" text-anchor="middle" font-size="13" font-weight="500" fill="#516581">prepare：固定选定版本</text><g><rect x="35" y="206" width="310" height="94" rx="12" fill="#f2f5fa" stroke="#516581" stroke-opacity=".36"/><path d="M36 226v54" stroke="#516581" stroke-width="3"/><text x="190.0" y="235" text-anchor="middle" font-size="18" font-weight="650" fill="#516581">工作台管理标记</text><text x="190.0" y="261" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">归档 / 删除，可恢复</text></g><g><rect x="755" y="206" width="310" height="94" rx="12" fill="#e7f8fa" stroke="#007a88" stroke-opacity=".36"/><path d="M756 226v54" stroke="#007a88" stroke-width="3"/><text x="910.0" y="235" text-anchor="middle" font-size="18" font-weight="650" fill="#007a88">原生 Crew / 工具状态</text><text x="910.0" y="261" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">各自管理 Session 与私有数据</text></g><path d="M345 253L395 253" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="370.0" y="244.0" text-anchor="middle" font-size="13" font-weight="500" fill="#516581">标记</text><path d="M705 253L755 253" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="730.0" y="244.0" text-anchor="middle" font-size="13" font-weight="500" fill="#516581">关联</text><g><rect x="215" y="365" width="670" height="98" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M216 385v58" stroke="#117d58" stroke-width="3"/><text x="550.0" y="394" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">Run 工作区与观察证据</text><text x="550.0" y="420" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">需求 / 指令 / 代码 / handoff / live / checks / accepted</text></g><path d="M550 300L550 365" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 300L810 365" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="860.0" y="323.5" text-anchor="middle" font-size="13" font-weight="500" fill="#516581">原生观察</text><g><rect x="35" y="526" width="490" height="92" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M36 546v52" stroke="#185adb" stroke-width="3"/><text x="280.0" y="555" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">Session 导出</text><text x="280.0" y="581" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">原生 Layer A + 固定配置 + 报告 / 开发文档</text></g><g><rect x="575" y="526" width="490" height="92" rx="12" fill="#fff4df" stroke="#9d6100" stroke-opacity=".36"/><path d="M576 546v52" stroke="#9d6100" stroke-width="3"/><text x="820.0" y="555" text-anchor="middle" font-size="18" font-weight="650" fill="#9d6100">完整备份另行规划</text><text x="820.0" y="581" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">工作目录 / 原生数据库 / 允许保存的工具状态</text></g><path d="M360 463L280 526" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 300L1080 300L1080 572L1067 572" fill="none" stroke="#748aad" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="32" y="657" text-anchor="start" font-size="15" font-weight="500" fill="#516581">定义、Run、管理标记与原生数据分别保存。Session ZIP 不等于完整运行环境备份。</text></svg>