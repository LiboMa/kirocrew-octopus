<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-label="Workflow、Run、Task、Session 的包含与关联" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><title>Workflow、Run、Task、Session 的包含与关联</title><desc>所有 ID 为机制示意，不包含实际会话。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748aad"/></marker></defs><rect width="1100" height="670" fill="white"/><g><rect x="385" y="20" width="330" height="88" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M386 40v48" stroke="#185adb" stroke-width="3"/><text x="550.0" y="49" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">Workflow：可复用定义</text><text x="550.0" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">例如：从需求到 Web 交付</text></g><path d="M550 108L280 153" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="120" y="153" width="320" height="85" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M121 173v45" stroke="#7052b7" stroke-width="3"/><text x="280.0" y="182" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">不可变版本 r1</text><text x="280.0" y="208" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">独立 JSON + 配置 SHA-256</text></g><path d="M550 108L820 153" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="660" y="153" width="320" height="85" rx="12" fill="#f2edff" stroke="#7052b7" stroke-opacity=".36"/><path d="M661 173v45" stroke="#7052b7" stroke-width="3"/><text x="820.0" y="182" text-anchor="middle" font-size="18" font-weight="650" fill="#7052b7">不可变版本 r2</text><text x="820.0" y="208" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">独立 JSON + 配置 SHA-256</text></g><g><rect x="25" y="290" width="320" height="84" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M26 310v44" stroke="#185adb" stroke-width="3"/><text x="185.0" y="319" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">Run / Session A</text><text x="185.0" y="345" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">固定 r1</text></g><g><rect x="390" y="290" width="320" height="84" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M391 310v44" stroke="#185adb" stroke-width="3"/><text x="550.0" y="319" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">Run / Session B</text><text x="550.0" y="345" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">固定 r1</text></g><g><rect x="755" y="290" width="320" height="84" rx="12" fill="#edf4ff" stroke="#185adb" stroke-opacity=".36"/><path d="M756 310v44" stroke="#185adb" stroke-width="3"/><text x="915.0" y="319" text-anchor="middle" font-size="18" font-weight="650" fill="#185adb">Run / Session C</text><text x="915.0" y="345" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">固定 r2</text></g><path d="M280 238L185 290" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 238L550 290" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 238L915 290" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 374L185 420" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="25" y="420" width="320" height="84" rx="12" fill="#fff4df" stroke="#9d6100" stroke-opacity=".36"/><path d="M26 440v44" stroke="#9d6100" stroke-width="3"/><text x="185.0" y="449" text-anchor="middle" font-size="18" font-weight="650" fill="#9d6100">逻辑步骤：code</text><text x="185.0" y="475" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">完整标识：Session A / code</text></g><path d="M345 462L390 462" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="390" y="420" width="320" height="84" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M391 440v44" stroke="#117d58" stroke-width="3"/><text x="550.0" y="449" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">原生执行 Task ID</text><text x="550.0" y="475" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">首次执行与续作是不同尝试</text></g><path d="M710 462L755 462" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="755" y="420" width="320" height="84" rx="12" fill="#eaf8f1" stroke="#117d58" stroke-opacity=".36"/><path d="M756 440v44" stroke="#117d58" stroke-width="3"/><text x="915.0" y="449" text-anchor="middle" font-size="18" font-weight="650" fill="#117d58">Crew 子 Session</text><text x="915.0" y="475" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">例如 subagent:conversation-A</text></g><path d="M915 504L915 550" fill="none" stroke="#748aad" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="755" y="550" width="320" height="86" rx="12" fill="#e7f8fa" stroke="#007a88" stroke-opacity=".36"/><path d="M756 570v46" stroke="#007a88" stroke-width="3"/><text x="915.0" y="579" text-anchor="middle" font-size="18" font-weight="650" fill="#007a88">工具原生 Session ID</text><text x="915.0" y="605" text-anchor="middle" font-size="14" font-weight="500" fill="#516581">Claude / Codex 等自己的身份</text></g><text x="28" y="590" text-anchor="start" font-size="18" font-weight="500" fill="#516581">Workflow ID ≠ Run ID ≠ 执行 Task ID ≠ 工具 Session ID</text><text x="28" y="616" text-anchor="start" font-size="18" font-weight="500" fill="#516581">上层关联让它们可追溯；它们不是同一个对象。</text></svg>