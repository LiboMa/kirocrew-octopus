<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1134"
      role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">ACP 多后端集成架构</title><desc id="architecture-desc">切换发生在任务 / 子 Session 边界；协议接口复用，工具上下文分别保留。</desc>
      <style>
      text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
      .title{font-size:30px;font-weight:700;fill:#153a68}
      .subtitle{font-size:18px;fill:#586e88}
      .label{font-size:21px;font-weight:650;fill:#193f71}
      .sub{font-size:17px;fill:#435c78}
      .native rect{fill:#f2f7ff;stroke:#a6c4ea;stroke-width:1.5}
      .extension rect{fill:#fff8eb;stroke:#d7b46f;stroke-width:1.5}
      .data rect{fill:#f0f8f5;stroke:#9ac8b5;stroke-width:1.5}
      .muted rect{fill:#f7f9fc;stroke:#c6d0dd;stroke-width:1.5}
      .edge{fill:none;stroke:#5a7fa8;stroke-width:2}
      .edge-label{font-size:17px;fill:#385d86;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
      .lane{stroke:#c8d5e5;stroke-dasharray:6 8;stroke-width:1.5}
      .note{font-size:17px;fill:#586e88}
      </style>
      <defs><marker id="architecture-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9" fill="#5a7fa8"/></marker></defs>
      <rect width="1440" height="1134" fill="#fff"/>
      <text x="36" y="48" class="title" text-anchor="start">ACP 多后端集成架构</text><text x="36" y="82" class="subtitle" text-anchor="start">切换发生在任务 / 子 Session 边界；协议接口复用，工具上下文分别保留。</text><path d="M230 230 V370 H380" class="edge" marker-end="url(#architecture-arrow)"/><text x="235" y="290" class="edge-label" text-anchor="start">主对话驱动</text><path d="M720 230 V320" class="edge" marker-end="url(#architecture-arrow)"/><text x="735" y="279" class="edge-label" text-anchor="start">固定配置 / 原生参数</text><path d="M1060 370 H1205 V230" class="edge" stroke-dasharray="7 6" marker-end="url(#architecture-arrow)"/><text x="1100" y="295" class="edge-label" text-anchor="start">状态 / 权限 / 结果</text><path d="M720 432 V476" class="edge" marker-end="url(#architecture-arrow)"/><path d="M720 566 V625" class="edge" marker-end="url(#architecture-arrow)"/><text x="740" y="604" class="edge-label" text-anchor="start">session_key · agent · cwd · overrides</text><path d="M720 725 V755 H195 M720 755 H1245" class="edge"/><path d="M195 755 V800" class="edge" marker-end="url(#architecture-arrow)"/><path d="M545 755 V800" class="edge" marker-end="url(#architecture-arrow)"/><path d="M895 755 V800" class="edge" marker-end="url(#architecture-arrow)"/><path d="M1245 755 V800" class="edge" marker-end="url(#architecture-arrow)"/><g class="native"><rect x="35" y="125" width="390" height="105" rx="12"/><text x="57" y="157" class="label" text-anchor="start">KiroCrew App / Chat</text><text x="57" y="185" class="sub" text-anchor="start">用户需求与主 Session</text><text x="57" y="209" class="sub" text-anchor="start">同一个 Gateway 下的开发入口</text></g><g class="extension"><rect x="525" y="125" width="390" height="105" rx="12"/><text x="547" y="157" class="label" text-anchor="start">Workflow 配置层 · PoC</text><text x="547" y="185" class="sub" text-anchor="start">Chat / 文件 / 引导式 Web</text><text x="547" y="209" class="sub" text-anchor="start">revision + 运行快照 + next_step</text></g><g class="extension"><rect x="1015" y="125" width="390" height="105" rx="12"/><text x="1037" y="157" class="label" text-anchor="start">观察与交接核对 · PoC</text><text x="1037" y="185" class="sub" text-anchor="start">真实 Task / backend / 参数</text><text x="1037" y="209" class="sub" text-anchor="start">accept → 状态报告与交付入口</text></g><g class="native"><rect x="380" y="320" width="680" height="112" rx="12"/><text x="402" y="352" class="label" text-anchor="start">KiroCrew 原生 Gateway 与任务生命周期</text><text x="402" y="380" class="sub" text-anchor="start">主 Agent → 托管 MCP spawn_run → SubagentManager</text><text x="402" y="404" class="sub" text-anchor="start">SessionManager 保存父子归属；完成事件返回主对话</text></g><g class="extension"><rect x="380" y="476" width="680" height="90" rx="12"/><text x="402" y="508" class="label" text-anchor="start">已有 Provider Registry 接口上的路由 · PoC</text><text x="402" y="536" class="sub" text-anchor="start">poc-* Agent → 后端配置副本 → 原生 create_provider_factory</text></g><g class="native"><rect x="380" y="625" width="680" height="100" rx="12"/><text x="402" y="657" class="label" text-anchor="start">原生 AcpProvider / ACP Client 或 Runtime</text><text x="402" y="685" class="sub" text-anchor="start">initialize → session/new | load → config → prompt</text><text x="402" y="709" class="sub" text-anchor="start">按能力处理 update、permission 与完成事件</text></g><g class="native"><rect x="35" y="800" width="320" height="112" rx="12"/><text x="57" y="832" class="label" text-anchor="start">Kiro CLI</text><text x="57" y="860" class="sub" text-anchor="start">原生 ACP Harness</text><text x="57" y="884" class="sub" text-anchor="start">按选定自定义 Agent 启动</text></g><g class="native"><rect x="385" y="800" width="320" height="112" rx="12"/><text x="407" y="832" class="label" text-anchor="start">Claude Code</text><text x="407" y="860" class="sub" text-anchor="start">claude-agent-acp</text><text x="407" y="884" class="sub" text-anchor="start">Agent SDK → 原生 Claude</text></g><g class="native"><rect x="735" y="800" width="320" height="112" rx="12"/><text x="757" y="832" class="label" text-anchor="start">Codex</text><text x="757" y="860" class="sub" text-anchor="start">codex-acp</text><text x="757" y="884" class="sub" text-anchor="start">Codex App Server</text></g><g class="native"><rect x="1085" y="800" width="320" height="112" rx="12"/><text x="1107" y="832" class="label" text-anchor="start">OpenCode</text><text x="1107" y="860" class="sub" text-anchor="start">OpenCode ACP</text><text x="1107" y="884" class="sub" text-anchor="start">原生工具循环与独立会话</text></g><g class="data"><rect x="35" y="957" width="670" height="100" rx="12"/><text x="57" y="989" class="label" text-anchor="start">共享交接材料 · 每次运行独立目录</text><text x="57" y="1017" class="sub" text-anchor="start">REQUEST / 指令 / 完整返回 / handoff / diff / tests</text><text x="57" y="1041" class="sub" text-anchor="start">版本与证据落盘；长期 Memory 不参与本次交接验证</text></g><g class="muted"><rect x="735" y="957" width="670" height="100" rx="12"/><text x="757" y="989" class="label" text-anchor="start">各工具保留自己的配置与状态</text><text x="757" y="1017" class="sub" text-anchor="start">独立 Session、认证、Skills、MCP 与模型上下文</text><text x="757" y="1041" class="sub" text-anchor="start">由 HOME / cwd / 原生配置 / 本次覆盖共同决定</text></g><text x="36" y="1102" class="note" text-anchor="start">蓝色：KiroCrew / 工具原生能力　　浅金：已交付 PoC 扩展　　绿色：可检查的文件交接</text></svg>